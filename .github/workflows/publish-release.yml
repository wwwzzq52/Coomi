name: Publish CoomiDev Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.4.71-dev)'
        required: true
        default: 'v1.4.71-dev'
      artifact_id:
        description: 'Artifact ID to download'
        required: true
        default: '11273423653'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        run: |
          set -euo pipefail
          echo "Downloading artifact ${{ inputs.artifact_id }}..."
          curl -sL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" \
            -o /tmp/artifact.zip
          ls -lh /tmp/artifact.zip
          unzip -o /tmp/artifact.zip -d /tmp/artifact/
          ls -lh /tmp/artifact/

      - name: Create git tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f "$TAG" origin/main
          git push origin "$TAG" --force
          echo "Tag $TAG pushed"

      - name: Upload as GitHub Release using gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          APK_PATH="/tmp/artifact/CoomiDev-1.4.71-dev-release-arm64-v8a.apk"
          test -f "$APK_PATH" || { echo "APK not found!"; ls -R /tmp/artifact/; exit 1; }
          APK_BASE=$(basename "$APK_PATH")
          SHA256_PATH="${APK_PATH}.sha256"
          SIZE_PATH="${APK_PATH}.size"

          echo "APK: $(ls -lh $APK_PATH)"
          [ -f "$SHA256_PATH" ] && echo "SHA256: $(cat $SHA256_PATH)"
          [ -f "$SIZE_PATH" ] && echo "Size: $(cat $SIZE_PATH)"

          # Check if release exists, delete if so
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "No existing release $TAG"
          fi

          # Create new release
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "CoomiDev $TAG" \
            --notes "Auto-built CoomiDev APK" \
            --prerelease \
            "$APK_PATH"
          echo "APK uploaded"

          # Upload checksum and size
          if [ -f "$SHA256_PATH" ]; then
            gh release upload "$TAG" "$SHA256_PATH" --clobber
            echo "SHA256 uploaded"
          fi
          if [ -f "$SIZE_PATH" ]; then
            gh release upload "$TAG" "$SIZE_PATH" --clobber
            echo "Size uploaded"
          fi

          echo "=== Release published ==="
          gh release view "$TAG" --json tagName,name,isPrerelease,assets --jq '.assets[].name'
          echo "URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

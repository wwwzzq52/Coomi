name: Build CoomiDev APK

on:
  push:
    branches: [codex/**]
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch/ref to build (default: dispatch branch)
        required: false
        type: string
      signing_store_password:
        description: Password for testkey_untrusted.jks (fallback: android)
        required: false
        type: string
        default: android
      signing_key_password:
        description: Key password inside the jks alias (fallback: android)
        required: false
        type: string
        default: android
      version_name:
        description: CoomiDev version name tag
        required: false
        type: string
        default: 1.4.71.0-dev
      version_code:
        description: Android versionCode
        required: false
        type: string
        default: "14071"

permissions:
  contents: read

concurrency:
  group: coomidev-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build CoomiDev APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Normalize inputs
        run: |
          set -euo pipefail
          : "${STORE_PW:=android}"
          : "${KEY_PW:=android}"
          : "${VERSION_NAME:=1.4.71.0-dev}"
          : "${VERSION_CODE:=14071}"
          echo "STORE_PW=$STORE_PW" >> "$GITHUB_ENV"
          echo "KEY_PW=$KEY_PW" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${{ github.event.inputs.ref }}" >> "$GITHUB_ENV"
          echo "STORE_PW=$STORE_PW KEY_PW=$KEY_PW VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE SOURCE_REF=${{ github.event.inputs.ref }}"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust 1.85 with Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: aarch64-linux-android
          components: rustfmt,clippy

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform
        run: |
          set -euo pipefail
          yes | sdkmanager \
            "ndk;27.0.12077973" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true
          sdkmanager --licenses || true
          ndk --version

      - name: Configure signing
        run: |
          set -euo pipefail
          APP_DIR=apps/coomi-app/app
          STORE_FILE="$APP_DIR/testkey_untrusted.jks"
          mkdir -p "$APP_DIR"

          if [ -f "$STORE_FILE" ]; then
            echo "Existing testkey_untrusted.jks found, testing password..."
            if keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PW" -alias alias -keypass "$KEY_PW" >/dev/null 2>&1; then
              echo "Existing keystore password valid."
            else
              echo "Existing jks password mismatch. Regenerating keystore."
              rm -f "$STORE_FILE"
            fi
          fi

          if [ ! -f "$STORE_FILE" ]; then
            echo "Generating fresh untrusted test keystore"
            keytool -genkeypair -v \
              -keystore "$STORE_FILE" \
              -storepass "$STORE_PW" \
              -keypass "$KEY_PW" \
              -alias alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CoomiDev-Untrusted,OU=Dev,O=Dev,L=Unknown,ST=Unknown,C=US"
          fi

          cat > apps/coomi-app/local.properties << PROPS
          coomi.signing.storePassword=$STORE_PW
          coomi.signing.keyPassword=$KEY_PW
          sdk.dir=$ANDROID_HOME
          PROPS
          chmod 600 apps/coomi-app/local.properties

      - name: Resolve NDK toolchain
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export TOOLCHAIN_DIR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "COOMI_NDK_TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "COOMI_ANDROID_CLANG=$TOOLCHAIN_DIR/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "COOMI_ANDROID_AR=$TOOLCHAIN_DIR/llvm-ar" >> "$GITHUB_ENV"
          echo "COOMI_ANDROID_RANLIB=$TOOLCHAIN_DIR/llvm-ranlib" >> "$GITHUB_ENV"
          test -x "$COOMI_ANDROID_CLANG"
          ls -la "$TOOLCHAIN_DIR" | head -5

      - name: Build Vue frontend
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci
          npm run type-check
          npm run build

      - name: Stage web assets
        run: |
          set -euo pipefail
          cd apps/coomi-app
          ./gradlew :app:stageCoomiWeb --no-daemon --max-workers=2

      - name: Build Rust engine (arm64)
        run: |
          set -euo pipefail
          cd apps/coomi-rs
          cargo fetch
          cargo build --release --target aarch64-linux-android
        env:
          TARGET_CC: ${{ env.COOMI_ANDROID_CLANG }}
          TARGET_AR: ${{ env.COOMI_ANDROID_AR }}
          TARGET_RANLIB: ${{ env.COOMI_ANDROID_RANLIB }}
          RUSTFLAGS: "-C linker=${{ env.COOMI_ANDROID_CLANG }}"

      - name: Stage Rust jniLibs
        run: |
          set -euo pipefail
          cd apps/coomi-app
          ./gradlew :app:stageCoomiRustAndroid --no-daemon --max-workers=2

      - name: Build CoomiDev APK
        run: |
          set -euo pipefail
          cd apps/coomi-app
          COOMI_DEV_BUILD=1 \
          TERMUX_APP_VERSION_NAME="$VERSION_NAME" \
          COOMI_NDK_HOME="$NDK_HOME" \
          ./gradlew :app:assembleRelease \
            -PcoomiVersionCode="$VERSION_CODE" \
            --no-daemon --max-workers=2
          find app/build/outputs/apk -name "CoomiDev-*.apk" -type f | tee /tmp/apk_list.txt
          test "$(wc -l < /tmp/apk_list.txt)" -ge 1

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find apps/coomi-app/app/build/outputs/apk -name "CoomiDev-*.apk" -type f | head -1)
          APK_ABS=$(readlink -f "$APK")
          echo "APK_ABS=$APK_ABS"
          echo "$APK_ABS" > /tmp/coomidev_apk_path.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_ABS" | tee /tmp/badging.txt | head -40
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_ABS" | tee /tmp/sign.txt | head -30

          grep -q 'package: name="com.coomidev.android"' /tmp/badging.txt || { echo "MISSING package"; exit 1; }
          grep -q "CoomiDev" /tmp/badging.txt || { echo "MISSING label"; exit 1; }
          grep -q "arm64-v8a" /tmp/badging.txt || { echo "MISSING ABI"; exit 1; }
          grep -qE 'Signature #.*Verified' /tmp/sign.txt || { echo "NOT SIGNED"; exit 1; }
          echo "APK verification PASSED"

      - name: Checksums
        run: |
          set -euo pipefail
          APK_ABS=$(cat /tmp/coomidev_apk_path.txt)
          cd "$(dirname "$APK_ABS")"
          sha256sum "$(basename "$APK_ABS")" > "$(basename "$APK_ABS").sha256"
          stat -c "%s bytes" "$(basename "$APK_ABS")" > "$(basename "$APK_ABS").size"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coomidev-apk
          path: |
            apps/coomi-app/app/build/outputs/apk/release/*.apk
            apps/coomi-app/app/build/outputs/apk/release/*.apk.sha256
            apps/coomi-app/app/build/outputs/apk/release/*.apk.size
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### CoomiDev APK build summary"
            echo ""
            echo "- Source ref: ${{ github.event.inputs.ref }}"
            echo "- Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "- Package: com.coomidev.android"
            echo "- ABI: arm64-v8a"
            echo "- Port: 18765"
            echo ""
            if [ -f /tmp/coomidev_apk_path.txt ]; then
              echo "- APK: $(cat /tmp/coomidev_apk_path.txt)"
            fi
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

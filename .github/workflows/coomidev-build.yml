name: Build CoomiDev APK

on:
  push:
    branches: [codex/**]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build CoomiDev APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      STORE_PW: android
      KEY_PW: android
      VERSION_NAME: 1.4.71.0-dev
      VERSION_CODE: "14071"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Patch build.gradle bug
        run: |
          set -uo pipefail
          echo "Fixing minSdkVersion.apiLevel.toInteger() bug in build.gradle..."
          sed -i 's/android\.defaultConfig\.minSdkVersion\.apiLevel/android.defaultConfig.minSdkVersion/' apps/coomi-app/app/build.gradle
          grep -n "minSdkVersion" apps/coomi-app/app/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust 1.85 with Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          targets: aarch64-linux-android
          components: rustfmt,clippy

      - name: Setup Android SDK and install NDK
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin"; do
            if [ -x "$candidate/sdkmanager" ]; then
              export PATH="$candidate:$PATH"
              echo "Added $candidate to PATH"
              break
            fi
          done
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "ndk;27.0.12077973" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          # Verify NDK exists
          test -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          test -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          echo "NDK 27.0.12077973 installed OK"

      - name: Configure signing
        run: |
          set -uo pipefail
          APP_DIR=apps/coomi-app/app
          STORE_FILE="$APP_DIR/testkey_untrusted.jks"
          mkdir -p "$APP_DIR"

          if [ -f "$STORE_FILE" ]; then
            echo "Existing testkey_untrusted.jks found, testing password..."
            if keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PW" -alias alias -keypass "$KEY_PW" >/dev/null 2>&1; then
              echo "Existing keystore password valid."
            else
              echo "Existing jks password mismatch. Regenerating keystore."
              rm -f "$STORE_FILE"
            fi
          fi

          if [ ! -f "$STORE_FILE" ]; then
            echo "Generating fresh untrusted test keystore"
            keytool -genkeypair -v \
              -keystore "$STORE_FILE" \
              -storepass "$STORE_PW" \
              -keypass "$KEY_PW" \
              -alias alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CoomiDev-Untrusted,OU=Dev,O=Dev,L=Unknown,ST=Unknown,C=US"
          fi

          cat > apps/coomi-app/local.properties << PROPS
          coomi.signing.storePassword=$STORE_PW
          coomi.signing.keyPassword=$KEY_PW
          sdk.dir=$ANDROID_HOME
          PROPS
          chmod 600 apps/coomi-app/local.properties

      - name: Build Vue frontend
        working-directory: apps/web
        run: |
          set -uo pipefail
          npm ci
          npm run type-check
          npm run build

      - name: Stage web assets
        run: |
          set -uo pipefail
          cd apps/coomi-app
          ./gradlew :app:stageCoomiWeb --no-daemon --max-workers=2

      - name: Build Rust engine (arm64)
        run: |
          set -uo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export TOOLCHAIN_DIR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export TARGET_CC="$TOOLCHAIN_DIR/aarch64-linux-android24-clang"
          export TARGET_AR="$TOOLCHAIN_DIR/llvm-ar"
          export TARGET_RANLIB="$TOOLCHAIN_DIR/llvm-ranlib"
          export RUSTFLAGS="-C linker=$TOOLCHAIN_DIR/aarch64-linux-android24-clang"
          cd apps/coomi-rs
          cargo fetch
          cargo build --release --target aarch64-linux-android

      - name: Stage Rust jniLibs
        run: |
          set -uo pipefail
          cd apps/coomi-app
          ./gradlew :app:stageCoomiRustAndroid --no-daemon --max-workers=2

      - name: Build CoomiDev APK
        run: |
          set -uo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export COOMI_NDK_TOOLCHAIN_DIR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export COOMI_ANDROID_CLANG="$COOMI_NDK_TOOLCHAIN_DIR/aarch64-linux-android24-clang"
          export COOMI_ANDROID_AR="$COOMI_NDK_TOOLCHAIN_DIR/llvm-ar"
          export COOMI_ANDROID_RANLIB="$COOMI_NDK_TOOLCHAIN_DIR/llvm-ranlib"
          cd apps/coomi-app
          COOMI_DEV_BUILD=1 \
          TERMUX_APP_VERSION_NAME="$VERSION_NAME" \
          COOMI_NDK_HOME="$NDK_HOME" \
          ./gradlew :app:assembleRelease \
            -PcoomiVersionCode="$VERSION_CODE" \
            --no-daemon --max-workers=2
          find app/build/outputs/apk -name "CoomiDev-*.apk" -type f

      - name: Verify APK
        run: |
          set -uo pipefail
          APK=$(find apps/coomi-app/app/build/outputs/apk -name "CoomiDev-*.apk" -type f)
          APK_ABS=$(readlink -f "$APK")
          echo "APK_ABS=$APK_ABS"
          echo "$APK_ABS" > /tmp/coomidev_apk_path.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_ABS" > /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_ABS" > /tmp/sign.txt

          grep -q 'package: name="com.coomidev.android"' /tmp/badging.txt || { echo "MISSING package"; exit 1; }
          grep -q "CoomiDev" /tmp/badging.txt || { echo "MISSING label"; exit 1; }
          grep -q "arm64-v8a" /tmp/badging.txt || { echo "MISSING ABI"; exit 1; }
          grep -qE 'Signature #.*Verified' /tmp/sign.txt || { echo "NOT SIGNED"; exit 1; }
          echo "APK verification PASSED"

      - name: Checksums
        run: |
          set -uo pipefail
          APK_ABS=$(cat /tmp/coomidev_apk_path.txt)
          cd "$(dirname "$APK_ABS")"
          sha256sum "$(basename "$APK_ABS")" > "$(basename "$APK_ABS").sha256"
          stat -c "%s bytes" "$(basename "$APK_ABS")" > "$(basename "$APK_ABS").size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coomidev-apk
          path: |
            apps/coomi-app/app/build/outputs/apk/release/*.apk
            apps/coomi-app/app/build/outputs/apk/release/*.apk.sha256
            apps/coomi-app/app/build/outputs/apk/release/*.apk.size
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### CoomiDev APK build summary"
            echo ""
            echo "- Version: $VERSION_NAME (code $VERSION_CODE)"
            echo "- Package: com.coomidev.android"
            echo "- ABI: arm64-v8a"
            echo "- Port: 18765"
            if [ -f /tmp/coomidev_apk_path.txt ]; then
              echo "- APK: $(cat /tmp/coomidev_apk_path.txt)"
            fi
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
